  P.nameForgotten=!!d.nameForgotten;P.recallNotes=Math.max(0,n(d.recallNotes));
  P.codex=Array.isArray(d.codex)?d.codex.filter(c=>c&&typeof c==="object"):[];
  P.relics=Array.isArray(d.relics)?d.relics.filter(c=>c&&typeof c==="object"):[];
  P.flags=d.flags&&typeof d.flags==="object"?d.flags:{};
  P.ach=d.ach&&typeof d.ach==="object"?Object.assign({},d.ach):{};
  P.stats=d.stats&&typeof d.stats==="object"?Object.assign({},d.stats):{};
  ensureAch();
  P.bag.forEach(it=>{if(it&&it.unknown!==undefined)it.unknown=!!it.unknown;});
  itemSeq=Math.max(itemSeq,n(d.itemSeq));
  P.bag.forEach(it=>{ensureGear(it);if(it.id>itemSeq)itemSeq=it.id;});
  SLOTDEF.forEach(s=>{const it=P.equip[s.k];if(it){ensureGear(it);if(it.id>itemSeq)itemSeq=it.id;}});
  stashItems().forEach(it=>{if(it){ensureGear(it);if(it.id>itemSeq)itemSeq=it.id;}});
  ensureBounties();
  P.alive=true;
  refreshMax(false);
  P.hp=clamp(d.hp==null?P.hpMax:n(d.hp),1,P.hpMax);
  P.mp=clamp(d.mp==null?P.mpMax:n(d.mp),0,P.mpMax);
  achCheck(true);
  return true;
}
function markSaved(){
  const el=$("savetoast");el.classList.add("on");
  clearTimeout(markSaved._t);markSaved._t=setTimeout(()=>el.classList.remove("on"),1600);
}
function saveNow(quiet){
  if(saveSlot==null||booting)return false;
  const ok=GloamSave.writeSlot(saveSlot,serializePlayer());
  if(ok&&!quiet)markSaved();
  return ok;
}
function saveSoon(){
  if(booting)return;
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveNow(true),600);
}
function setPause(on){
  $("pause").classList.toggle("on",!!on);
  if(on){
    PANELS.forEach(p=>togglePanel(p,false));pickSkill=null;renderBarUI();renderTabs();
    $("pause-meta").textContent=P.name+" · "+CLASSES[P.cls].n+" · 等级 "+P.lvl+" · 功绩 "+achDoneN()+"/"+ACH.length+" · 槽 "+(saveSlot+1);
  }
}
function closeXfer(){$("xfer").classList.remove("on");}
function openExport(){
  saveNow(true);
  $("xfer-box").value=GloamSave.exportSlot(saveSlot);
  $("xfer").classList.add("on");
}
function restartRun(){
  if(!confirm("焚毁当前卷宗并回到铸名厅？此举不可撤销。"))return;
  GloamSave.deleteSlot(saveSlot);
  location.href=GloamSave.hrefTo("create.html");
}
function refreshName(){UI.pname.textContent=P.nameForgotten?"？？？":P.name;
  UI.pname.style.color=P.nameForgotten?"#8a7f70":"";}
function startingWeapon(cls){
  const base=BASES.weapon[cls][0];
  return{id:++itemSeq,type:"weapon",glyph:base.g,rarity:0,name:"磨损的"+base.n,ilvl:1,
    dmgMin:base.d[0],dmgMax:base.d[1],armor:0,affixes:[],spd:base.sp,cls,sockets:[],reforged:0};
}
function startNew(name,cls){
  P.name=name;P.cls=cls;
  const c=CLASSES[cls];
  P.base={str:c.base.str,dex:c.base.dex,vit:c.base.vit,ene:c.base.ene};
  refreshName();
  P.equip.weapon=startingWeapon(cls);
  const first=SKILLS.find(s=>s.cls===cls&&s.req===1);
  P.ranks[first.id]=1;P.barSkills[0]=first.id;P.skPts=0;
  P.bountyDun={};P.bountyPotless=0;P.bountyDay="";P.bountyList=[];P.bountyClaimed={};P.bountyChest=false;
  P.ach={};P.stats={deaths:0,goldLooted:0,maxRarity:0,reforged:0,punched:0,socketed:0,recalled:0,recited:0,bounties:0};
  P.trackId="q1";qSel="q1";P.hub="town";
  stashItems().forEach(it=>{if(it&&it.id>itemSeq)itemSeq=it.id;});
  refreshMax(true);rebuildPlayer();
  renderBarUI();renderTabs();renderQuests();renderTrack();renderChar();renderBag();renderSkills();
  enterArea("town");
  ensureBounties();
  P.hp=P.hpMax;P.mp=P.mpMax;
  say(`镇子建在一道裂口上。桥头把「<b style="color:#ecd39a">${P.name}</b>」刻上了木牌——裂口爱偷这个。`);
  setTimeout(()=>say(`你以<b style="color:#e2c47f">${c.n}</b>的身份进了镇。去广场北面找塞琳领活。`),1200);
}
function bootFromMenu(){
  const boot=GloamSave.getBoot();
  if(!boot){location.replace("index.html");return false;}
  saveSlot=boot.slot|0;
  if(boot.mode==="load"){
    const data=GloamSave.getSlot(boot.slot);
    if(!data||!applySave(data)){
      if(data)GloamSave.deleteSlot(boot.slot);
      location.replace(GloamSave.hrefTo("load.html"));
      return false;
    }
    refreshName();
    rebuildPlayer();
    renderBarUI();renderTabs();renderQuests();renderTrack();renderChar();renderBag();renderSkills();
    enterArea(hubId());
    ensureBounties();
    if((data.hp||0)<=0){P.hp=P.hpMax;P.mp=P.mpMax;}
    else{
      P.hp=clamp(data.hp,1,P.hpMax);
      P.mp=clamp(data.mp==null?P.mpMax:data.mp,0,P.mpMax);
    }
  }else{
    startNew(boot.name||"流浪者",boot.cls||"warrior");
  }
  return true;
}

if(!bootFromMenu())return;
booting=false;saveNow(true);
$("veil").classList.add("off");
SFX.portal();
// 资产清单后台载入：拿到后把当前方块玩家换成 GLB 骨架（失败则维持方块，游戏照跑）
AssetRegistry.boot().then(()=>{
  const kind="char_"+P.cls;
  if(AssetRegistry.ready&&AssetRegistry.manifest&&AssetRegistry.manifest[kind])
    AssetRegistry.load(kind).then(rec=>{if(rec&&rec.scene)rebuildPlayer();});
});
loop();
setInterval(()=>saveNow(true),60000);
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveNow(true);});
window.addEventListener("beforeunload",()=>saveNow(true));
window.__GLOAMTEST={openNPC,P,pStats,rollItem,rollRune,rollAffixes,reforgeCost,punchCost,maxSockets,ensureGear,doReforge,doPunch,doSocketIn,doSocketOut,gearAt,ACH,achCheck,unlockAch,ensureAch,togglePanel,achDoneN};
})();
</script>
