  else if(it.kind==="potion"){if(it.pot==="hp")P.potHp++;else P.potMp++;SFX.loot();
    floatText(it.x,1.2,it.z,it.pot==="hp"?"治疗药水":"法力药水","#d0c0a0",14);}
  else if(it.kind==="relic"){collectRelic(it.relic);}
  else{
    const g=it.item;
    if(isUnderground()&&g.type!=="rune")g.unknown=true;
    if(g.type==="charm"){
      let where="bag";
      if(addToCharms(g))where="charm";
      else if(P.bag.length>=CFG.BAG){hint("行囊已满");return;}
      else P.bag.push(g);
      noteLoot(g);SFX.loot();
      const r=RARITY[g.rarity]||RARITY[0];
      if(g.unknown){floatText(it.x,1.4,it.z,"想不起来的东西","#8a7f70",15);
        say(`拾取 <span style="color:#8a7f70">想不起来的东西</span>（${where==="charm"?"已进遗物袋":"遗物袋满了，先放行囊"}）`);}
      else{
        floatText(it.x,1.4,it.z,g.name,r.c,16);
        say(where==="charm"?`遗物生效：<span style="color:${r.c}">${g.name}</span>`
          :`遗物袋满了，<span style="color:${r.c}">${g.name}</span> 先放进行囊，不生效`);
      }
      afterCharmChange();
    }else{
      if(P.bag.length>=CFG.BAG){hint("行囊已满");return;}
      P.bag.push(g);noteLoot(g);SFX.loot();
      if(g.unknown){floatText(it.x,1.4,it.z,"想不起来的东西","#8a7f70",15);
        say(`拾取 <span style="color:#8a7f70">想不起来的东西</span>（回镇找玛拉回想，或用回想的纸条）`);}
      else{const r=RARITY[g.rarity]||RARITY[0];
        floatText(it.x,1.4,it.z,g.name,r.c,16);
        say(`拾取 <span style="color:${r.c}">${g.name}</span>`);}
      if($("inv").classList.contains("on"))renderBag();
    }
  }
  W.group.remove(it.mesh);
  it.mesh.traverse(o=>{if(o.geometry&&o.geometry!==goldGeo&&o.geometry!==potGeo)o.geometry.dispose();});
  W.items.splice(i,1);
  achCheck();
  saveSoon();
}

/* ═════════ 21. 更新 ═════════ */
let camShake=0,repathBudget=0;
function lerpAngle(a,b,t){const d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*t;}
function animateBody(m,walkPhase,atk,dt){
  if(m.rigged){
    const moving=Math.abs(walkPhase-(m._lw==null?walkPhase:m._lw))>.05;m._lw=walkPhase;
    let want=atk>0?"attack":(moving?"run":"idle");
    if(!m.actions[want])want=m.actions.idle?"idle":m.cur; // 缺哪段回落到 idle
    if(want&&want!==m.cur&&m.actions[want]){
      if(m.cur&&m.actions[m.cur])m.actions[m.cur].fadeOut(.16);
      m.actions[want].reset().fadeIn(.16).play();m.cur=want;
    }
    if(m.mixer)m.mixer.update(dt||.016);
    return;
  }
  const sw=Math.sin(walkPhase)*.55;
  if(m.beast){
    m.armL.rotation.x=sw;m.armR.rotation.x=-sw;m.legL.rotation.x=-sw;m.legR.rotation.x=sw;
    m.group.position.y=Math.abs(Math.sin(walkPhase))*.06;
    m.head.rotation.x=atk>0?-.5+(1-clamp(atk/.4,0,1))*.9:0;
  }else{
    m.legL.rotation.x=sw;m.legR.rotation.x=-sw;m.armL.rotation.x=-sw*.7;
    if(atk>0){const t=1-clamp(atk/.34,0,1);m.armR.rotation.x=-2.1+t*3.4;m.armR.rotation.z=-.5+t*.6;}
    else{m.armR.rotation.x=sw*.7;m.armR.rotation.z=0;}
    m.group.position.y=Math.abs(Math.sin(walkPhase))*.055;
  }
}
function moveEntity(ent,nx,nz){
  if(ent!==P){
    if(wallBlock(nx,ent.z))nx=ent.x;
    if(wallBlock(ent.x,nz))nz=ent.z;
  }
  if(canStand(nx,ent.z,.42))ent.x=nx;
  if(canStand(ent.x,nz,.42))ent.z=nz;
}
function breakProp(pr){
  pr.alive=false;pr.mesh.visible=false;burst(pr.x,.6,pr.z,pr.vault?0xe2c47f:0x7a5330,10,4);SFX.hit();
  const lv=floorLvl();
  if(pr.vault){
    dropAt(pr.x,pr.z,{kind:"gold",amt:Math.round(rf(18,42)*lv*8*goldFindMul()*riftLootMul())});
    dropAt(pr.x+rf(-.6,.6),pr.z+rf(-.6,.6),{kind:"item",item:rollItem(lv,true)});
    if(RND()<.4)dropAt(pr.x+rf(-.5,.5),pr.z+rf(-.5,.5),{kind:"item",item:rollRune(RND()<.35?3:2)});
    return;
  }
  if(RND()<.45)dropAt(pr.x,pr.z,{kind:"gold",amt:Math.round(rf(4,14)*lv*goldFindMul())});
  else if(RND()<.28)dropAt(pr.x,pr.z,{kind:"potion",pot:RND()<.6?"hp":"mp"});
}
function updatePlayer(dt){
  if(!P.alive)return;
  for(const k in P.cds)P.cds[k]=Math.max(0,P.cds[k]-dt);
  flushSkillQueue();
  P.potCd=Math.max(0,P.potCd-dt);P.atkCd=Math.max(0,P.atkCd-dt);
  P.hitFlash=Math.max(0,P.hitFlash-dt);P.invuln=Math.max(0,P.invuln-dt);
  P.chill=Math.max(0,(P.chill||0)-dt);
  P.stun=Math.max(0,(P.stun||0)-dt);
  P.frozen=Math.max(0,(P.frozen||0)-dt);
  if(P.poison){
    P.poison.t-=dt;P.poison.acc+=dt;
    if(P.poison.acc>=1){
      P.poison.acc=0;
      const tick=Math.max(1,Math.round(P.poison.dmg));
      if(P.up&&P.up.unfin)P.hp=Math.max(1,P.hp-tick);else P.hp-=tick;
      floatText(P.x,2.2,P.z,"-"+tick,"#8ade5a",14);
      if(P.hp<=0)die();
    }
    if(P.poison.t<=0)P.poison=null;
  }
  if(P.kb&&P.kb.left>0){
    const step=Math.min(P.kb.left,16*dt);
    moveEntity(P,P.x+P.kb.dx*step,P.z+P.kb.dz*step);
    P.kb.left-=step;
    if(P.kb.left<=0)P.kb=null;
  }
  for(const k in P.buffs){
    if(P.buffs[k].floor)continue;
    P.buffs[k].t-=dt;if(P.buffs[k].t<=0)delete P.buffs[k];
  }
  if(P.shield>0){P.shieldT-=dt;if(P.shieldT<=0){P.shield=0;delete P.buffs.shield;delete P.buffs.potsh;}}
  updateUnique(dt);
  const s=pStats(),cls=CLASSES[P.cls],inTown=W.area.kind==="town";
  const gx=tX(P.x),gz=tZ(P.z),tp=(W.paint&&gx>=0&&gz>=0&&gx<CFG.MAP&&gz<CFG.MAP)?W.paint[gi(gx,gz)]:0;
  if(W.area&&W.area.hz==="ice"&&tp===5){
    W.hzAcc=(W.hzAcc||0)+dt;
    if(W.hzAcc>.45){W.hzAcc=0;
      if(pwr("u_breath")&&P.up.beatOn)floatText(P.x,2.2,P.z,"换气","#e2c47f",12);
      else{P.hp=Math.max(1,P.hp-5);floatText(P.x,2.2,P.z,"薄冰","#9fd4ff",12);}
    }
  }else W.hzAcc=0;
  const cap=pwr("u_law")?P.hpMax*.8:P.hpMax;
  if(!(P.up&&P.up.unfin))P.hp=clamp(P.hp+dt*(.6+P.lvl*.14+(s.hpre||0)*.2)*(inTown?8:1),0,cap);
  P.mp=clamp(P.mp+dt*(1.4+s.ene*.09+0.5*talRank("mar5")+(s.mpre||0)*.25)*(inTown?8:1),0,P.mpMax);

  if(P.casting==="town"){
    P.castT+=dt;UI.castf.style.width=clamp(P.castT/2.5*100,0,100)+"%";
    if(P.castT>=2.5){P.casting=null;UI.cast.style.display="none";enterArea(hubId());return;}
  }
  if(P.casting==="well"){
    const wm=W.event&&W.event.mark;
    if(!wm||W.event.kind!=="riftwell"||W.event.state!=="open"||dist2(wm.x,wm.z,P.x,P.z)>3.4*3.4){
      P.casting=null;UI.cast.style.display="none";hint("封口中断");
    }else{
      P.castT+=dt;UI.castf.style.width=clamp(P.castT/2.4*100,0,100)+"%";
      if(P.castT>=2.4){P.casting=null;UI.cast.style.display="none";closeRiftWell();return;}
    }
  }
  // 旋风斩引导
  if(P.channel){
    if(playerLocked()&&!phraseOn("notyou"))P.channel=null;
    else{
    P.channel.t-=dt;P.channel.acc+=dt;
    pModel.group.rotation.y+=dt*14;
    if(P.channel.acc>=.35){
      P.channel.acc=0;
      W.enemies.forEach(e=>{if(!e.dead&&dist2(e.x,e.z,P.x,P.z)<(P.channel.rad||3.6)*(P.channel.rad||3.6))
        dealToEnemy(e,rf(s.dmgMin,s.dmgMax)*P.channel.dmg*synMul("whirl"),false,"#ffc080",false,false,"phys");});
      burst(P.x,1,P.z,0xffa040,6,3);
      if(setOn("grey",6)){
        P.up.whirlN=Math.min(8,(P.up.whirlN||0)+1);
        if(P.up.whirlN>=8){P.up.greyCleave=true;P.up.whirlN=0;floatText(P.x,2.6,P.z,"满层","#1eff00",13);}
      }
    }
    if(P.channel.t<=0)P.channel=null;
    }
  }
  if(P.target&&P.target.dead)P.target=null;
  const locked=playerLocked();
  if(locked){P.path=[];P.channel=null;}
  if(pointer.down&&!P.target&&!P.npcTarget&&!locked){
    const p=groundPoint();
    if(performance.now()-P.lastHold>110){P.lastHold=performance.now();
      if(dist2(p.x,p.z,P.x,P.z)>1.2*1.2)walkTo(p.x,p.z);}
  }
  if(P.target&&!P.channel&&!locked){
    const d=Math.sqrt(dist2(P.target.x,P.target.z,P.x,P.z));
    if(d>cls.range){
      if(!P.path.length||performance.now()-P.lastChase>350){P.lastChase=performance.now();walkTo(P.target.x,P.target.z);}
    }else{
      P.path=[];P.dir=Math.atan2(P.target.x-P.x,P.target.z-P.z);
      if(P.atkCd<=0){
        P.atkCd=s.atkTime;P.anim.atk=.30;P.anim.atkDone=false;
        if(cls.atk==="melee")SFX.swing();
      }
    }
  }
  if(P.anim.atk>0){
    P.anim.atk-=dt;
    if(!P.anim.atkDone&&P.anim.atk<.16){
      P.anim.atkDone=true;
      if(!locked&&P.target&&!P.target.dead&&dist2(P.target.x,P.target.z,P.x,P.z)<(cls.range+.6)*(cls.range+.6))
        autoAttack(P.target);
      if(cls.atk==="melee")W.props.forEach(pr=>{if(pr.alive&&dist2(pr.x,pr.z,P.x,P.z)<2.6*2.6)breakProp(pr);});
    }
  }
  W.props.forEach(pr=>{if(pr.alive&&pr.vault&&dist2(pr.x,pr.z,P.x,P.z)<1.7*1.7)breakProp(pr);});
  updateRoomHint();
  updateTraps(dt);
  if(P.path.length&&(!P.channel||P.channel.walk)&&!locked){
    const n=P.path[0],dx=n.x-P.x,dz=n.z-P.z,d=Math.hypot(dx,dz);
    if(d<.28)P.path.shift();
    else{const sp=s.speed*dt*(tp===5?.64:1)*((P.chill||0)>0?.55:1);moveEntity(P,P.x+dx/d*sp,P.z+dz/d*sp);P.dir=Math.atan2(dx,dz);P.anim.walk+=dt*10;}
  }else if(!P.kb)P.anim.walk=lerp(P.anim.walk,0,dt*8);

  if(P.npcTarget&&dist2(P.npcTarget.x,P.npcTarget.z,P.x,P.z)<3.4*3.4){
    openNPC(P.npcTarget.id);P.npcTarget=null;P.path=[];}
  for(let i=W.items.length-1;i>=0;i--){
    const it=W.items[i];
    if(it.kind!=="item"&&dist2(it.x,it.z,P.x,P.z)<1.5*1.5)takeItem(i);
    else if(P.pickupTarget===it&&dist2(it.x,it.z,P.x,P.z)<2*2){takeItem(i);P.pickupTarget=null;}
  }
  // 传送点
  let onAny=null;
  for(const m of W.marks){
    if(!m.mesh.visible)continue;
    if(dist2(m.x,m.z,P.x,P.z)<2.3*2.3){onAny=m;break;}
  }
  if(onAny&&P.onMark!==onAny){
    P.onMark=onAny;
    if(!(onAny.kind==="event"&&!onAny.use)){useMark(onAny);return;}
  }
  if(!onAny)P.onMark=null;

  const m=pModel;
  m.group.position.set(P.x,0,P.z);
  if(!P.channel)m.group.rotation.y=lerpAngle(m.group.rotation.y,P.dir,.25);
  animateBody(m,P.anim.walk,P.anim.atk,dt);
  // 受击/无敌染色：几何体用本体色，GLB 骨架平时用纯白不污染贴图
  const tint=P.hitFlash>0?0xff8080:(P.frozen>0?0xa8e8ff:(P.invuln>0?0xa0d8ff:(m.rigged?0xffffff:playerLook().body)));
  if(m.torso&&m.torso.material&&m.torso.material.color)m.torso.material.color.setHex(tint);
}
function updateEnemies(dt){
  repathBudget=5;
  for(const e of W.enemies){
    const m=e.model;
    if(e.dead){
      e.dieT+=dt;
      m.group.rotation.x=lerp(m.group.rotation.x,-Math.PI/2*.92,dt*6);
      m.group.position.y=lerp(m.group.position.y,.15,dt*6);
      m.group.scale.multiplyScalar(1-dt*.25);
      if(e.dieT>2.2&&m.group.parent)scene.remove(m.group);
      continue;
    }
    e.hitFlash=Math.max(0,e.hitFlash-dt);e.slow=Math.max(0,e.slow-dt);
    e.stun=Math.max(0,e.stun-dt);e.frozen=Math.max(0,(e.frozen||0)-dt);
    e.atkCd=Math.max(0,e.atkCd-dt);
    e.anim.atk=Math.max(0,e.anim.atk-dt);e.skillCd=Math.max(0,e.skillCd-dt);
    if(e.dot){
      e.dot.t-=dt;e.dot.acc+=dt;
      if(e.dot.acc>=1){e.dot.acc=0;dealToEnemy(e,e.dot.dmg,false,"#8ade5a",true,true,"shadow");}
      if(e.dot.t<=0)e.dot=null;
      if(e.dead)continue;
    }
    if(e.stun>0||e.frozen>0){
      e.wind=0;
      m.group.position.set(e.x,0,e.z);
      tickChoirAura(e);
      if(e.frozen>0){if(Math.random()<.08)burst(e.x,2.1,e.z,0x8fd3ff,1,1);}
      else if(Math.random()<.1)burst(e.x,2.2,e.z,0xffe080,1,1);
      if(m.torso&&m.torso.material&&m.torso.material.color)
        m.torso.material.color.setHex(e.frozen>0?0xa8e8ff:(e.hitFlash>0?0xffffff:(m.rigged?0xffffff:ETYPES[e.type].body)));
      if(e.bar.group.visible){
        e.bar.fill.scale.x=clamp(e.hp/e.hpMax,0,1);
        e.bar.group.quaternion.copy(camera.quaternion);
        e.bar.group.rotation.y-=m.group.rotation.y;
      }
      continue;
    }
    if(e.ally){updateAlly(e,dt);continue;}
    const d=Math.sqrt(dist2(e.x,e.z,P.x,P.z));
    const aggro=e.boss?30:14;
    if(!P.alive)e.state="idle";
    else if(d<aggro)e.state=d<=e.range?"attack":"chase";
    else if(e.state!=="idle"&&d>aggro*1.6)e.state="idle";
    if(e.woke>0)e.woke-=dt;
    let spd=e.speed*(e.slow>0?.4:1)*(e.woke>0?1.25:1);
    noteChoir(e);
    if(e.choired)spd*=CHOIR_SPD;
    tickChoirAura(e);
    if(e.spellImm>0)e.spellImm=Math.max(0,e.spellImm-dt);
    if(e.hoard){
      e.hoardSeen=e.hoardSeen||(P.alive&&d<18);
      if(e.hoardSeen&&P.alive){
        e.hoardFlee=(e.hoardFlee||0)+dt;
        const ax=e.x-P.x,az=e.z-P.z,l=Math.hypot(ax,az)||1;
        const ox=e.x,oz=e.z;
        moveEntity(e,e.x+ax/l*spd*1.5*dt,e.z+az/l*spd*1.5*dt);
        if(Math.hypot(e.x-ox,e.z-oz)<.03){
          const a=Math.random()*TAU;
          moveEntity(e,e.x+Math.cos(a)*spd*1.2*dt,e.z+Math.sin(a)*spd*1.2*dt);
        }
        e.dir=Math.atan2(e.x-P.x,e.z-P.z);
        const from=Math.hypot(e.x-(e.hoardX||0),e.z-(e.hoardZ||0));
        if(e.hoardFlee>26||from>34)riftHoardEscape(e);
      }
      m.group.position.set(e.x,0,e.z);
      m.group.rotation.y=lerpAngle(m.group.rotation.y,e.dir,.2);
      animateBody(m,e.anim.walk,e.anim.atk,dt);
      if(e.bar.group.visible){
        e.bar.fill.scale.x=clamp(e.hp/e.hpMax,0,1);
        e.bar.group.quaternion.copy(camera.quaternion);
        e.bar.group.rotation.y-=m.group.rotation.y;
      }
      continue;
    }
    if(e.spellImm>0)e.spellImm=Math.max(0,e.spellImm-dt);
    if(pwr("u_second")&&P.up&&P.up.nails){
      for(const n of P.up.nails) if(dist2(e.x,e.z,n.x,n.z)<25){spd*=.6;break;}
    }

    // §05 塞克拉 · 两阶段：血量 50% 时「想起来了」
    if(e.sekhra&&e.phase===1&&e.hp<=e.hpMax*.5){
      e.phase=2;e.speed*=1.4;e.shoutCd=0;
      floatText(e.x,5,e.z,"“"+e.childName+"”","#ffe6a0",30);
      ringFX(e.x,e.z,10,0xfff0a0,3);camShake=.8;SFX.boom();
      say(`<span style="color:#ecd39a">塞克拉喊出「${e.childName}」。她不再找了，朝你冲过来。</span>`);
    }

    // 「喊名字的」词缀：周期性大喊，唤醒周围沉睡的死者
    if(e.shout&&e.state!=="idle"&&P.alive){
      e.shoutCd=(e.shoutCd||0)-dt;
      if(e.shoutCd<=0){
        e.shoutCd=e.phase===2?4.5:6.5;
        const nm=e.sekhra&&e.phase===1?e.callName:(e.callName||e.childName||"——");
        floatText(e.x,4.2,e.z,"“"+nm+"？”","#e8dcae",20);
        ringFX(e.x,e.z,e.boss?9:6,0xd8c88a,1.2);SFX.cast();
        let woke=0;
        for(const o of W.enemies){
          if(o===e||o.dead)continue;
          if(dist2(o.x,o.z,e.x,e.z)<(e.boss?14:10)**2){o.state="chase";o.woke=3;woke++;}
        }
        if(woke)floatText(e.x,5,e.z,"惊醒了 "+woke+" 具","#b09a6a",14);
      }
    }
    if(e.grudgeImm){e.grudgeImm.t-=dt;if(e.grudgeImm.t<=0)e.grudgeImm=null;}
    if(hasMod(e,"burn")&&e.state!=="idle"){
      e.burnDrop=(e.burnDrop||0)-dt;
      if(e.burnDrop<=0){
        e.burnDrop=.5;
        if(zones.filter(z=>z.hurt==="player").length<24){
          const z0=zoneAt(e.x,e.z,1.15,6,.7,Math.max(4,Math.round(e.dmg[0]*.22)),0xff6a2a);
          z0.hurt="player";
        }
      }
    }
    if(hasMod(e,"count")&&e.state!=="idle"&&P.alive){
      e.countT=(e.countT==null?8:e.countT)-dt;
      const sec=Math.ceil(e.countT);
      if(sec<=3&&sec>0&&sec!==e.countSaid){e.countSaid=sec;floatText(e.x,4.7,e.z,String(sec),"#e2c47f",26);}
      if(e.countT<=0){
        e.countT=10;e.countSaid=-1;
        floatText(e.x,4.2,e.z,"数到了","#e2c47f",18);
        ringFX(e.x,e.z,7,0xe2c47f,2);SFX.boom();camShake=Math.max(camShake,.2);
        if(dist2(P.x,P.z,e.x,e.z)<49){hurtPlayer(rf(e.dmg[0],e.dmg[1])*1.15,true,e);knockbackPlayer(e.x,e.z,3.2);}
      }
    }
    if(hasMod(e,"rush")&&P.alive&&e.state!=="idle"){
      if(!e.rushOut&&d<3.8&&e.state==="attack"){e.rushOut=true;e.rushT=1.5;}
      if(e.rushOut){
        e.rushT=(e.rushT||0)-dt;
        const ax=e.x-P.x,az=e.z-P.z,l=Math.hypot(ax,az)||1;

        for(let i=0;i<12;i++){const a=i/12*TAU;
          shoot(new THREE.Vector3(e.x+Math.cos(a),1.3,e.z+Math.sin(a)),
            new THREE.Vector3(Math.cos(a),0,Math.sin(a)),rf(e.dmg[0],e.dmg[1])*.7,"enemy",0xf0e0a0,11,.24);}
        SFX.cast();
      }else if(e.skill==="slam"){
        e.slamAt={x:P.x,z:P.z,t:1.1};ringFX(P.x,P.z,5.5,0xff5a2a,.9);
        floatText(e.x,4,e.z,"跃击！","#ff8a5a",19);
      }
    }
    if(e.slamAt){
      e.slamAt.t-=dt;
      if(e.slamAt.t<=0){
        const s2=e.slamAt;e.slamAt=null;
        SFX.boom();camShake=.5;burst(s2.x,.8,s2.z,0xff6a2a,22,7);ringFX(s2.x,s2.z,5.5,0xffb060,4);
        if(dist2(P.x,P.z,s2.x,s2.z)<5.5*5.5){
          hurtPlayer(rf(e.dmg[0],e.dmg[1])*1.6,true,e);
          knockbackPlayer(s2.x,s2.z,4.4);applyPlayerStun(.4);
        }
        if(canStand(s2.x,s2.z,.6)){e.x=s2.x+rf(-1,1);e.z=s2.z+rf(-1,1);}
      }
    }
    if(e.state==="chase"){
      if(losFree(e.x,e.z,P.x,P.z)){
        e.path=[];
        let ax=(P.x-e.x)/d,az=(P.z-e.z)/d;
        for(const o of W.enemies){
          if(o===e||o.dead)continue;
          const dd=dist2(o.x,o.z,e.x,e.z);
          if(dd<1.6&&dd>1e-4){const inv=1/Math.sqrt(dd);ax+=(e.x-o.x)*inv*.55;az+=(e.z-o.z)*inv*.55;}}
        const l=Math.hypot(ax,az)||1;
        moveEntity(e,e.x+ax/l*spd*dt,e.z+az/l*spd*dt);
        e.dir=Math.atan2(P.x-e.x,P.z-e.z);
      }else{
        e.repath-=dt;
        if((!e.path.length||e.repath<=0)&&repathBudget>0){
          repathBudget--;e.repath=.65;
          e.path=pathToWorld(findPath(tX(e.x),tZ(e.z),tX(P.x),tZ(P.z),1400));}
        if(e.path.length){
          const n=e.path[0],dx=n.x-e.x,dz=n.z-e.z,dl=Math.hypot(dx,dz);
          if(dl<.3)e.path.shift();
          else{moveEntity(e,e.x+dx/dl*spd*dt,e.z+dz/dl*spd*dt);e.dir=Math.atan2(dx,dz);}}
      }
      e.anim.walk+=dt*9;
    }else if(e.state==="attack"){
      e.dir=Math.atan2(P.x-e.x,P.z-e.z);
      e.anim.walk=lerp(e.anim.walk,0,dt*6);
      if(e.atkCd<=0){e.atkCd=e.atkSpeed;e.anim.atk=.4;e.wind=.26;}
      if(e.wind>0){
        e.wind-=dt;
        if(e.wind<=0){
          if(e.ranged){
            const dir=new THREE.Vector3(P.x-e.x,0,P.z-e.z).normalize();
            shoot(new THREE.Vector3(e.x+dir.x,1.3,e.z+dir.z),dir,rf(e.dmg[0],e.dmg[1])*choirMul(e),"enemy",
              e.pcolor,e.boss?14:12,e.boss?.42:.26);
            SFX.cast();
          }else if(dist2(e.x,e.z,P.x,P.z)<(e.range+.6)*(e.range+.6))hurtPlayer(rf(e.dmg[0],e.dmg[1])*choirMul(e),false,e);
        }
      }
    }else e.anim.walk=lerp(e.anim.walk,0,dt*6);

    m.group.position.set(e.x,0,e.z);
    m.group.rotation.y=lerpAngle(m.group.rotation.y,e.dir,.2);
    animateBody(m,e.anim.walk,e.anim.atk,dt);
    // 方块用本体色染，GLB 骨架平时纯白不污染贴图，仅受击闪白
    if(m.torso&&m.torso.material&&m.torso.material.color)
      m.torso.material.color.setHex(e.hitFlash>0?0xffffff:(e.choired&&!m.rigged?0xd4c08a:(m.rigged?0xffffff:ETYPES[e.type].body)));
    if(e.bar.group.visible){
      e.bar.fill.scale.x=clamp(e.hp/e.hpMax,0,1);
      e.bar.group.quaternion.copy(camera.quaternion);
      e.bar.group.rotation.y-=m.group.rotation.y;
    }
  }
  for(let i=W.enemies.length-1;i>=0;i--)if(W.enemies[i].dead&&W.enemies[i].dieT>2.4)W.enemies.splice(i,1);
}
function updateProjectiles(dt){
  for(let i=W.projectiles.length-1;i>=0;i--){
    const p=W.projectiles[i];
    p.life-=dt;
    if(p.homing&&p.owner==="player"){
      const t=nearestEnemy(p.x,p.z,14);
      if(t){const dx=t.x-p.x,dz=t.z-p.z,l=Math.hypot(dx,dz)||1,sp=Math.hypot(p.vx,p.vz);
        p.vx=lerp(p.vx,dx/l*sp,.14);p.vz=lerp(p.vz,dz/l*sp,.14);}
    }
    p.x+=p.vx*dt;p.z+=p.vz*dt;
    p.mesh.position.set(p.x,p.y,p.z);
    p.mesh.rotation.y=Math.atan2(p.vx,p.vz);
    let hit=!canStand(p.x,p.z,.2),remove=hit;
    if(!hit){
      if(p.owner==="player"){
        for(const e of W.enemies){
          if(e.dead||e.ally)continue;
          if(p.hitSet&&p.hitSet.indexOf(e.id)>=0)continue;
          const rr=(e.boss?1.6:e.elite?1.1:.85)+p.r;
          if(dist2(e.x,e.z,p.x,p.z)<rr*rr){
            let pd=p.dmg;
            if(p.dusk&&p.hitSet)pd*=1+.12*p.hitSet.length;
            dealToEnemy(e,pd,false,"#ffa04a",false,p.spell,p.elem);
            if(p.linger)zoneAt(e.x,e.z,1.8,3,.4,p.dmg*.45,0xff6a2a,"fire");
            if(p.dot&&!e.dead)applyPoison(e,p.dot.dur,p.dot.dmg);
            if(p.spread&&RND()*100<p.spread){
              W.enemies.forEach(o=>{if(o===e||o.dead||dist2(o.x,o.z,e.x,e.z)>9)return;
                if(p.dot)applyPoison(o,p.dot.dur,p.dot.dmg*.5);
                dealToEnemy(o,p.dmg*.4,false,"#8ade5a",true);});
            }
            if(p.hitSet)p.hitSet.push(e.id);
            else{
              const sr=p.splashR||1.8,sm=p.splashM||.35;
              W.enemies.forEach(o=>{if(o!==e&&!o.dead&&dist2(o.x,o.z,p.x,p.z)<sr*sr)dealToEnemy(o,p.dmg*sm,false,"#ffa04a");});
              remove=true;
            }
            hit=true;break;}}
      }else if(P.alive&&P.invuln<=0&&dist2(P.x,P.z,p.x,p.z)<(.8+p.r)*(.8+p.r)){hurtPlayer(p.dmg,false,{type:p.elem||"shadow"});hit=true;remove=true;}
    }
    if(hit)burst(p.x,p.y,p.z,p.color,6,4);
    if(remove||p.life<=0){
      scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();
      W.projectiles.splice(i,1);}
  }
}
function updateMeteors(dt){
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    m.y-=dt*(m.speed||26);m.mesh.position.y=m.y;m.mesh.rotation.x+=dt*6;
    if(m.y<=.6){
      SFX.boom();camShake=.4;burst(m.x,.8,m.z,0xff6a2a,26,8);ringFX(m.x,m.z,m.r||5,0xffb060,4);
      const rr=(m.r||5)*(m.r||5);
      W.enemies.forEach(e=>{if(!e.dead&&dist2(e.x,e.z,m.x,m.z)<rr)dealToEnemy(e,m.dmg,false,"#ffb060",false,m.spell,m.elem||"fire");});
      scene.remove(m.mesh);m.mesh.geometry.dispose();m.mesh.material.dispose();meteors.splice(i,1);}
  }
}
function updateZones(dt){
  for(let i=zones.length-1;i>=0;i--){
    const z=zones[i];
    z.t-=dt;z.acc+=dt;
    z.mesh.material.opacity=.18+Math.abs(Math.sin(z.t*8))*.16;
    if(z.acc>=z.tick){
      z.acc=0;
      burst(z.x+rf(-z.r,z.r),2.4,z.z+rf(-z.r,z.r),z.color,3,1);
      if(z.hurt==="player"){
        if(P.alive&&dist2(P.x,P.z,z.x,z.z)<z.r*z.r){
          if(z.dmg)hurtPlayer(z.dmg,true);
          if(z.poison)applyPlayerPoison(z.poison[0],z.poison[1]);
        }
      }else{
        W.enemies.forEach(e=>{if(!e.dead&&dist2(e.x,e.z,z.x,z.z)<z.r*z.r){
          dealToEnemy(e,z.dmg,false,"#ffe6a0",true,true,z.elem||"phys");
          if(z.dot)applyPoison(e,z.dot.t,z.dot.dmg);
        }});
      }
    }
    if(z.t<=0){scene.remove(z.mesh);z.mesh.geometry.dispose();z.mesh.material.dispose();zones.splice(i,1);}
  }
}
function updateFX(dt){
  for(const p of partPool){
    if(p.life<=0)continue;
    p.life-=dt;
    if(p.life<=0){p.mesh.visible=false;continue;}
    p.vy-=13*dt;
    p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;
    if(p.mesh.position.y<.08){p.mesh.position.y=.08;p.vy*=-.32;p.vx*=.6;p.vz*=.6;}
    p.mesh.material.opacity=clamp(p.life/p.max,0,1);
    p.mesh.rotation.x+=dt*7;p.mesh.rotation.y+=dt*5;
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.t+=dt*r.sp;
    r.mesh.scale.setScalar(Math.max(.01,r.t*r.max));
    r.mesh.material.opacity=clamp(.8-r.t*.85,0,1);
    if(r.t>1){scene.remove(r.mesh);r.mesh.geometry.dispose();r.mesh.material.dispose();rings.splice(i,1);}
  }
  for(let i=beams.length-1;i>=0;i--){
    const b=beams[i];b.t+=dt*4;b.mesh.material.opacity=clamp(.85-b.t,0,1);
    if(b.t>1){scene.remove(b.mesh);b.mesh.geometry.dispose();b.mesh.material.dispose();beams.splice(i,1);}
  }
}
function updateWorld(dt,time){
  const cand=[];
  for(const t of W.torches){
    t.mesh.scale.setScalar(.85+Math.sin(time*9+t.ph)*.16+Math.sin(time*23+t.ph)*.06);
    const d=dist2(t.x,t.z,P.x,P.z);if(d<900)cand.push({t,d});
  }
  cand.sort((a,b)=>a.d-b.d);
  for(let i=0;i<lightPool.length;i++){
    const l=lightPool[i];
    if(i<cand.length){const t=cand[i].t;l.position.set(t.x,t.y+.3,t.z);
      l.intensity=1.15+Math.sin(time*11+t.ph)*.22;}
    else l.intensity=0;
  }
  torchLight.position.set(P.x,2.2,P.z);
  torchLight.intensity=W.dark?1.5+Math.sin(time*7)*.12:.35;
  for(const it of W.items){it.t+=dt;it.mesh.position.y=Math.sin(it.t*2.4)*.12;it.mesh.rotation.y+=dt*1.4;}
  W.npcs.forEach(n=>{
    if(n.path&&n.path.length)return;
    if(n.model.mixer){n.model.mixer.update(dt);return;} // GLB NPC 播 idle
    if(!n.model.armR)return;
    n.model.group.position.y=Math.sin(time*1.6+n.ph)*.035;
    n.model.armR.rotation.x=Math.sin(time*1.2+n.ph)*.12;});
  updateEvent(dt);
  const bossAlive=W.boss&&!W.boss.dead;
  W.marks.forEach(m=>{
    if(m.kind==="next"&&bossAlive){m.mesh.visible=false;return;}
    if(m.off){m.mesh.visible=false;return;}
    m.mesh.visible=true;
    if(m.mesh.userData.ring){
      m.mesh.userData.ring.rotation.z+=dt*1.2;
      m.mesh.userData.core.material.opacity=.4+Math.sin(time*3)*.16;}
  });
  // 副本首领死亡后出现出口
  const px=tX(P.x),pz=tZ(P.z);
  for(let y=pz-9;y<=pz+9;y++)for(let x=px-9;x<=px+9;x++){
    if(x<0||y<0||x>=CFG.MAP||y>=CFG.MAP)continue;
    if((x-px)*(x-px)+(y-pz)*(y-pz)<=81)W.explored[gi(x,y)]=1;}
}
function updateCamera(dt){
  if(feel.cine&&feel.cine.e&&!feel.cine.e.dead){
    const c=feel.cine,e=c.e,u=clamp(c.t/c.dur,0,1);
    const ease=u*u*(3-2*u);
    const ang=c.ang+ease*1.18,dist=17-ease*3.2,h=13+Math.sin(ease*Math.PI)*4.2;
    camera.position.x=lerp(camera.position.x,e.x+Math.sin(ang)*dist,.14);
    camera.position.y=lerp(camera.position.y,h,.14);
    camera.position.z=lerp(camera.position.z,e.z+Math.cos(ang)*dist,.14);
    camera.lookAt(e.x,2.15,e.z);
    return;
  }
  const t=1-Math.pow(.001,dt);
  camera.position.x=lerp(camera.position.x,P.x+CAM_OFF.x*camZoom,t);
  camera.position.y=lerp(camera.position.y,CAM_OFF.y*camZoom,t);
  camera.position.z=lerp(camera.position.z,P.z+CAM_OFF.z*camZoom,t);
  if(camShake>0){camShake-=dt*1.4;camera.position.x+=rf(-1,1)*camShake;camera.position.z+=rf(-1,1)*camShake;}
  camera.lookAt(P.x,1.1,P.z);
}

function drawMinimap(){
  const c=UI.mm,S=168,R=28;
  c.clearRect(0,0,S,S);c.fillStyle="#07060a";c.fillRect(0,0,S,S);
  const px=tX(P.x),pz=tZ(P.z),cell=S/(R*2);

  const floorCol=kind==="town"?"#4a4132":kind==="field"?"#39422e":"#2e2a23";
  for(let y=-R;y<R;y++)for(let x=-R;x<R;x++){
    const gx=px+x,gy=pz+y;
    if(gx<0||gy<0||gx>=CFG.MAP||gy>=CFG.MAP)continue;

    c.fillRect((x+R)*cell,(y+R)*cell,cell+.6,cell+.6);
  }
  const dot=(wx,wz,col,sz)=>{
    const dx=(tX(wx)-px+R)*cell,dy=(tZ(wz)-pz+R)*cell;

  W.items.forEach(it=>dot(it.x,it.z,it.kind==="gold"?"#f5c451":it.kind==="potion"?"#c04030":it.kind==="relic"?"#ecd39a":(RARITY[it.item&&it.item.rarity]||RARITY[0]).c,3));
  W.npcs.forEach(n=>dot(n.x,n.z,"#7ec8ff",5));

  W.enemies.forEach(e=>{if(!e.dead)dot(e.x,e.z,e.boss?"#ff2f2f":e.ally?"#7ec87a":e.su||e.hoard?"#e2c47f":e.elite?"#ffa030":"#a63a2a",e.boss?6:e.ally||e.su||e.hoard?5:3);});
  c.fillStyle="#f0e0b8";c.beginPath();c.arc(S/2,S/2,3.4,0,TAU);c.fill();
  c.strokeStyle="rgba(176,141,79,.18)";c.lineWidth=1;
  c.beginPath();c.moveTo(S/2,0);c.lineTo(S/2,S);c.moveTo(0,S/2);c.lineTo(S,S/2);c.stroke();
}
function updateFeel(raw){
  if(feel.stopCd>0)feel.stopCd=Math.max(0,feel.stopCd-raw);
  if(feel.comboT>0){
    feel.comboT-=raw;
    if(feel.comboT<=0){feel.combo=0;paintCombo();}
  }
  if(feel.queue){
    feel.queue.t-=raw;
    if(feel.queue.t<=0)feel.queue=null;
  }
  if(feel.cine||feel.story||!W.boss||W.boss.dead||W.boss.seenIntro)return;
  if(!P.alive||!W.area||W.area.kind==="town")return;
  if(W.boss.hp<W.boss.hpMax){W.boss.seenIntro=true;return;}
  if(dist2(W.boss.x,W.boss.z,P.x,P.z)<26*26)startBossIntro(W.boss);
}
function loop(){
  requestAnimationFrame(loop);
  const raw=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;
  if($("pause").classList.contains("on")||$("xfer").classList.contains("on")){
    renderer.render(scene,camera);return;
  }
  updateFeel(raw);
  if(feel.story){
    feel.story.t+=raw;
    if(feel.story.t>=1.15)$("storycine").classList.add("ready");
    updateCamera(raw);updateHUD(raw);
    renderer.render(scene,camera);
    if($("pc").classList.contains("on")&&dollModel){
      if(dollAuto)dollRot+=raw*.5;
      dollModel.group.rotation.y=dollRot;
      dollR.render(dollScene,dollCam);
    }
    return;
  }
  if(feel.cine){
    feel.cine.t+=raw;
    if(feel.cine.e&&feel.cine.e.dead)endBossIntro();
    else if(feel.cine.t>=feel.cine.dur)endBossIntro();
    updateCamera(raw);updateHUD(raw);
    renderer.render(scene,camera);
    if($("pc").classList.contains("on")&&dollModel){
      if(dollAuto)dollRot+=raw*.5;
      dollModel.group.rotation.y=dollRot;
      dollR.render(dollScene,dollCam);
    }
    return;
  }
  if(feel.stop>0){
    feel.stop-=raw;
    if(feel.stop>0){
      updateCamera(raw);updateHUD(raw);
      renderer.render(scene,camera);
      if($("pc").classList.contains("on")&&dollModel){
        dollModel.group.rotation.y=dollRot;
        dollR.render(dollScene,dollCam);
      }
      return;
    }
  }
  let dt=raw;
  if(feel.slow>0){
    feel.slow-=raw;
    dt=raw*(feel.slowMul||.3);
    if(feel.slow<=0)feel.slowMul=1;
  }
  updatePlayer(dt);updateEnemies(dt);updateProjectiles(dt);updateMeteors(dt);updateZones(dt);
  updateFX(dt);updateWorld(dt,time);updateCamera(dt);updateHUD(dt);
  renderer.render(scene,camera);
  if($("pc").classList.contains("on")&&dollModel){
    if(dollAuto)dollRot+=dt*.5;
    dollModel.group.rotation.y=dollRot;
    dollR.render(dollScene,dollCam);
  }
}

function bootFromMenu(){
  const boot=GloamSave.getBoot();
  if(!boot){location.replace("index.html");return false;}
  saveSlot=boot.slot|0;
  if(boot.mode==="load"){
    const data=GloamSave.getSlot(boot.slot);
    if(!data||!applySave(data)){
      if(data)GloamSave.deleteSlot(boot.slot);
      location.replace(GloamSave.hrefTo("load.html"));
      return false;
    }
    refreshName();
    rebuildPlayer();
    renderBarUI();renderTabs();renderQuests();renderTrack();renderChar();renderBag();renderSkills();
    enterArea(hubId());
    ensureBounties();
    if((data.hp||0)<=0){P.hp=P.hpMax;P.mp=P.mpMax;}
    else{
      P.hp=clamp(data.hp,1,P.hpMax);
      P.mp=clamp(data.mp==null?P.mpMax:data.mp,0,P.mpMax);
    }
  }else{
    startNew(boot.name||"流浪者",boot.cls||"warrior");
  }
  return true;
}
