<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gloamrift · 铸名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/menu.css">
</head>
<body>
<canvas id="fx"></canvas>
<div class="grain"></div>
<div class="vignette"></div>
<a class="back" href="index.html" id="back">← 标题</a>

<div class="stage top">
  <div class="hall">
    <h1>THE FORGE OF NAMES</h1>
    <p class="sub">铸名厅  ·  选一条路下去砍</p>
    <div class="classrow" id="classes"></div>
    <div class="forge">
      <div class="plate" style="padding:18px 20px 16px">
        <div class="field">
          <label>NAME  ·  名号</label>
          <div class="name-row">
            <input id="name" maxlength="16" spellcheck="false" placeholder="写下你的名">
            <button type="button" class="dice" id="dice" title="随机">⚀</button>
          </div>
        </div>
        <div class="field" style="margin-top:16px">
          <label>ARCHIVE  ·  卷宗槽</label>
          <div class="slotpicks" id="slots"></div>
          <div class="warn" id="warn"></div>
        </div>
      </div>
      <div class="plate" style="padding:18px 20px 16px">
        <div class="field">
          <label>ATTRIBUTES  ·  起手属性</label>
          <div class="stats" id="stats"></div>
        </div>
        <div class="actions">
          <button type="button" class="btn wide dis" id="begin">下行 · DESCEND</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="foot">CHOOSE A PATH  ·  镇子下面有一道裂口</div>

<script src="js/saves.js"></script>
<script src="js/classes.js"></script>
<script src="js/atmosphere.js"></script>
<script src="js/ui-tone.js"></script>
<script>
(function(){
  GloamAtmosphere.attach("#fx", {theme:"forge"});
  var chosen = null, slot = 0;
  var maxStat = 24;
  var diceGlyphs = "⚀⚁⚂⚃⚄⚅";

  function rndName(){
    return GLOAM_NAMES[Math.floor(Math.random()*GLOAM_NAMES.length)];
  }
  document.getElementById("name").value = rndName();

  var row = document.getElementById("classes");
  Object.keys(GLOAM_CLASSES).forEach(function(k){
    var c = GLOAM_CLASSES[k];
    var d = document.createElement("div");
    d.className = "classcard plate";
    d.innerHTML = '<div class="cg">'+c.glyph+'</div><div class="en">'+c.en+'</div>'+
      '<div class="zh">'+c.zh+'</div><div class="role">'+c.roleZh+'</div>'+
      '<div class="cd">'+c.descZh+'</div><div class="lore">'+c.lore+'</div>';
    d.addEventListener("mouseenter", GloamTone.hover);
    d.addEventListener("click", function(){
      chosen = k; GloamTone.click();
      row.querySelectorAll(".classcard").forEach(function(x){
        x.classList.remove("sel"); x.style.boxShadow = "";
      });
      d.classList.add("sel");
      d.style.boxShadow = "0 0 0 1px "+c.accent+", 0 0 28px rgba(180,130,50,.28)";
      renderStats(); syncBegin();
    });
    row.appendChild(d);
  });

  function renderSlots(){
    var box = document.getElementById("slots");
    box.innerHTML = "";
    GloamSave.getSlots().forEach(function(s, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "slotpick"+(i===slot?" on":"")+(s?" busy":"");
      b.textContent = s ? ("槽 "+(i+1)+" · "+s.name) : ("空槽 "+(i+1));
      b.addEventListener("click", function(){
        slot = i; GloamTone.click(); renderSlots(); syncBegin();
      });
      box.appendChild(b);
    });
  }
  function renderStats(){
    var el = document.getElementById("stats");
    if(!chosen){ el.innerHTML = '<div class="stat" style="grid-column:1/-1">先选一条道路。</div>'; return; }
    var b = GLOAM_CLASSES[chosen].base;
    var rows = [["力量","str"],["敏捷","dex"],["体魄","vit"],["精神","ene"]];
    el.innerHTML = rows.map(function(r){
      var v = b[r[1]], pct = Math.round(v/maxStat*100);
      return '<div class="stat"><span>'+r[0]+'</span><span class="bar"><i style="width:'+pct+'%"></i></span><b>'+v+'</b></div>';
    }).join("");
  }
  function syncBegin(){
    var name = document.getElementById("name").value.trim();
    var ok = chosen && name.length >= 1;
    document.getElementById("begin").classList.toggle("dis", !ok);
    var occ = GloamSave.getSlot(slot);
    document.getElementById("warn").textContent = occ ? ("将覆盖「"+occ.name+"」的卷宗。") : "";
  }

  document.getElementById("back").addEventListener("click", function(e){
    e.preventDefault();
    location.href = GloamSave.hrefTo("index.html");
  });
  document.getElementById("dice").addEventListener("click", function(){
    this.textContent = diceGlyphs[Math.floor(Math.random()*6)];
    document.getElementById("name").value = rndName();
    GloamTone.click(); syncBegin();
  });
  document.getElementById("name").addEventListener("input", syncBegin);
  document.getElementById("begin").addEventListener("click", function(){
    if(this.classList.contains("dis")) return;
    var name = document.getElementById("name").value.trim().slice(0,16);
    var occ = GloamSave.getSlot(slot);
    if(occ && !confirm("覆盖「"+occ.name+"」的卷宗？此举不可撤销。")){ GloamTone.deny(); return; }
    GloamTone.confirm();
    location.href = GloamSave.hrefToGame({mode:"new", slot:slot, name:name, cls:chosen});
  });

  renderSlots(); renderStats(); syncBegin();
})();
</script>
</body>
</html>
